<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Access — KŌBŌ</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="site-header-mount"></div>

    <main class="page-shell">
      <div class="container">
        <div class="auth-split">
          <div class="auth-editorial">
            <img
              src="/images/atelier-banner.jpg"
              alt="KŌBŌ studio tabletop with stoneware and brass instruments"
            />
            <div class="auth-editorial-caption">
              <span class="mono-label">Client Ledger</span>
              <p style="margin: 0.4rem 0 0; color: var(--ink-secondary); font-size: 0.9rem;">
                Save your delivery address, keep your shopping bag synced across sessions, and review studio order dispatches in one place.
              </p>
            </div>
          </div>

          <div class="auth-panel">
            <span class="mono-label">KŌBŌ Client Access</span>
            <h1 style="font-family: var(--font-display); font-size: 2.25rem; font-weight: 500; margin: 0.35rem 0 1.25rem;">
              Welcome to the Studio
            </h1>

            <div class="auth-tabs" role="tablist">
              <button type="button" class="auth-tab-btn is-active" id="tab-login-btn" data-tab="login">
                Sign In
              </button>
              <button type="button" class="auth-tab-btn" id="tab-register-btn" data-tab="register">
                Create Account
              </button>
            </div>

            <div id="auth-feedback"></div>

            <form id="login-form" novalidate>
              <div class="form-field">
                <label for="login-email">Email Address</label>
                <input
                  type="email"
                  id="login-email"
                  class="form-input"
                  placeholder="you@domain.com"
                  required
                />
              </div>
              <div class="form-field">
                <label for="login-password">Password</label>
                <input
                  type="password"
                  id="login-password"
                  class="form-input"
                  placeholder="Enter password"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
                Sign In
              </button>

              <div class="demo-callout">
                <div>
                  <span class="mono-label" style="display: block;">Quick Preview</span>
                  <span style="font-size: 0.84rem; color: var(--ink-secondary);">
                    demo@kobo-studio.in · Demo@1234
                  </span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="fill-demo-btn">
                  Fill Demo Credentials
                </button>
              </div>
            </form>

            <form id="register-form" style="display: none;" novalidate>
              <div class="form-grid">
                <div class="form-field is-full">
                  <label for="reg-name">Full Name</label>
                  <input
                    type="text"
                    id="reg-name"
                    class="form-input"
                    placeholder="e.g. Kabir Verma"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="reg-email">Email Address</label>
                  <input
                    type="email"
                    id="reg-email"
                    class="form-input"
                    placeholder="you@domain.com"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="reg-phone">Phone (Optional)</label>
                  <input
                    type="tel"
                    id="reg-phone"
                    class="form-input"
                    placeholder="+91 98..."
                  />
                </div>
                <div class="form-field is-full">
                  <label for="reg-password">Password (min 6 characters)</label>
                  <input
                    type="password"
                    id="reg-password"
                    class="form-input"
                    placeholder="Create a secure password"
                    required
                  />
                </div>
                <div class="form-field is-full">
                  <label for="reg-address">Default Delivery Address (Optional)</label>
                  <input
                    type="text"
                    id="reg-address"
                    class="form-input"
                    placeholder="Street, neighborhood, city"
                  />
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-full" id="register-submit-btn">
                Create Account
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer-mount"></div>

    <script src="/js/store.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
